<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Invaders — Juego</title>

    <!-- ============================================================
         dsescomenta esta linea del css
         <link rel="stylesheet" href="css/styles.css">
         ============================================================ -->
</head>
<body>

    <!-- BARRA SUPERIOR / HUD  (el JS actualiza estos valores) -->
    <header id="hud" class="hud">
        <div class="hud-item">Puntaje: <span id="puntaje">0</span></div>
        <div class="hud-item">Nivel: <span id="nivel">1</span></div>
        <div class="hud-item">Vidas: <span id="vidas">3</span></div>
    </header>

    <!-- ZONA DEL JUEGO -->
    <main id="zona-juego" class="zona-juego">

        <!-- Pantalla de inicio (el JS la muestra/oculta) -->
        <div id="pantalla-inicio" class="pantalla pantalla-inicio">
            <h1 class="titulo-juego">SPACE INVADERS</h1>
            <button id="boton-iniciar" class="boton">INICIAR</button>
        </div>

        <!-- Lienzo principal: aqui game.js dibuja jugador, enemigos y balas -->
        <canvas id="lienzo-juego" class="lienzo" width="600" height="700">
            Tu navegador no soporta el elemento canvas.
        </canvas>

        <!-- Pantalla de fin de juego (el JS la muestra al perder) -->
        <div id="pantalla-game-over" class="pantalla pantalla-game-over" hidden>
            <h2>GAME OVER</h2>
            <p>Puntaje final: <span id="puntaje-final">0</span></p>
            <button id="boton-reiniciar" class="boton">VOLVER A JUGAR</button>
        </div>

    </main>

    <!-- CONTROLES EN PANTALLA  (el JS escucha estos botones) -->
    <footer id="controles-juego" class="controles-juego">
        <button id="boton-izquierda" class="boton-control">&#9668; Izquierda</button>
        <button id="boton-disparar" class="boton-control">Disparar</button>
        <button id="boton-derecha" class="boton-control">Derecha &#9658;</button>
        <button id="boton-pausar" class="boton-control">Pausa</button>
    </footer>

    <!-- Enlace de regreso al menu principal -->
    <nav class="navegacion-juego">
        <a href="homepage.html">&#8592; Volver al inicio</a>
    </nav>

    <!-- SPRITES: imagenes que el JS cargara para dibujar en el canvas -->
    <img id="sprite-jugador" src="assets/player.png" alt="Nave del jugador" hidden>
    <img id="sprite-enemigo" src="assets/enemy.png" alt="Invasor alienigena" hidden>

    <!-- ============================================================
        descomenta esto a la hora de poner el js y css
         <script src="js/player.js"></script>
         <script src="js/enemy.js"></script>
         <script src="js/bullets.js"></script>
         <script src="js/game.js"></script>
         ============================================================ -->

</body>
</html>
